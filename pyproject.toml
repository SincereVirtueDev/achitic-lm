[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "achitic-lm"
version = "0.1.0"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["torch>=2.2", "numpy>=1.24", "sentencepiece>=0.2", "pyyaml>=6"]
[project.optional-dependencies]
dev = ["pytest>=8"]
export = ["gguf>=0.10"]
[tool.setuptools.packages.find]
include = ["achitic*"]
